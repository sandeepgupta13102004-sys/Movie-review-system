<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Movie Review System</h1>
        <section id="top-movie-section">
          <h2>Top Rated Movies</h2>
          <div id="movies-list"></div>
    </section>
    <hr style="margin: 30px 0;">

    <section id="review-section">
        <h2>Submit a Review</h2>
        <form id="review-form">
            <label for="username">Username:</label>
            <input type="text" id="username" required placeholder="Enter your name">

        <label for="rating">Rating(1 to 5):</label>
        <select id="rating" required>
            <option value="">Select a rating</option>
            <option value="1">1- Poor (1 star)</option>
            <option value="2">2- Fair (2 stars)</option>
            <option value="3">3- Good (3 stars)</option>
            <option value="4">4- Very Good (4 stars)</option>
            <option value="5">5- Excellent (5 stars)</option>
        </select>
        <label for="comment">Comment:</label>
        <textarea id="comment"  rows="4" required placeholder="Write your review here..."></textarea>
        <button type="submit">Submit Review</button>
    </form>
    <div id="message" style="margin-top: 20px; font-weight: bold;"></div>
    </section>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
